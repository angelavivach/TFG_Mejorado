<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Usuarios</title>
    <link rel="stylesheet" href="b.css">
    <link rel="icon" type="image/png" href="/icono/favicon.png">

    <style>
        .error-message {
            color: red;
            margin: 10px 0;
            height: 20px;
            font-size: 14px;
            text-align: center;
        }
        .success-message {
            color: green;
            margin: 10px 0;
            font-size: 14px;
            text-align: center;
        }
        /* Añadir para mejor visualización en móviles */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
            input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Contenedor de Inicio de Sesión -->
        <div class="form-container sign-in-container">
            <form id="adminLoginForm">
                <h1>Iniciar sesión</h1>
                <input type="email" placeholder="Correo electrónico" id="adminUser" autocomplete="username" required />
                <input type="password" placeholder="Contraseña" id="adminPass" autocomplete="current-password" required />
                
                <div id="admin-error" class="error-message"></div>
                
                <button type="submit">Entrar</button>
            </form>
        </div>
        
        <!-- Contenedor de Registro -->
        <div class="form-container sign-up-container">
            <form id="adminRegisterForm">
                <h1>Registro de Usuario</h1>
                <input type="text" placeholder="Nombre Completo" id="companyName" required />
                <input type="email" placeholder="Correo electrónico" id="newAdminUser" required />
                <input type="password" placeholder="Contraseña (8+ caracteres, letras y números)" id="newAdminPass" autocomplete="new-password" required />
                <input type="password" placeholder="Confirmar Contraseña" id="confirmAdminPass" autocomplete="new-password" required />
                
                <div id="register-error" class="error-message"></div>
                <div id="register-success" class="success-message"></div>
                
                <button type="submit">Registrarse</button>
            </form>
        </div>
        
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>¡Bienvenido!</h1>
                    <p>Accede con tus credenciales</p>
                    <button class="ghost" id="adminSignIn">Iniciar sesión</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>¿Nuevo usuario?</h1>
                    <p>Crea tu cuenta de empleado para acceder al sistema</p>
                    <button class="ghost" id="adminSignUp">Registrarse</button>
                </div>
            </div>
        </div>
    </div>

    <script src="c.js" type="module"></script>
</body>
</html>
